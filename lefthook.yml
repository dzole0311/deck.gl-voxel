pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css}'
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    - name: prettier
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css,scss,html,md,mdx,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
